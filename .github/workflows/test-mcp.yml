name: MCP compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        sdk: ['mcp>=1.12,<2', 'mcp>=2,<3']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "${{ matrix.sdk }}"
      - name: Test client configuration and stdio protocol
        run: python -m unittest discover -s tests -v
