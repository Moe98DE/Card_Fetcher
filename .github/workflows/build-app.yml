
name: Build MTG Deck Formatter

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # Use setup-python only for Windows and macOS
      - name: Set up Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Linux: use Ubuntu 22.04's native Python 3.10
      - name: Set up Linux Python environment
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-dev
          /usr/bin/python3 --version
          ldd --version | head -n 1
          /usr/bin/python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller requests certifi

      - name: Install dependencies (Windows/macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests certifi

      - name: Build Windows GUI executable
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller --onefile --windowed
          --collect-all certifi
          --name MtgDeckFormatter main_gui.py

      - name: Build Windows debug executable
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller --onefile --console
          --log-level DEBUG --collect-all certifi
          --name MtgDeckFormatter-debug main_gui.py

      - name: Build macOS application
        if: runner.os == 'macOS'
        run: >
          python -m PyInstaller --windowed
          --name MtgDeckFormatter main_gui.py

      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: |
          .venv/bin/python -m PyInstaller \
            --onefile \
            --name MtgDeckFormatter \
            main_gui.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MtgDeckFormatter-${{ runner.os }}
          path: |
            dist/MtgDeckFormatter.exe
            dist/MtgDeckFormatter-debug.exe
            dist/MtgDeckFormatter.app/
            dist/MtgDeckFormatter
