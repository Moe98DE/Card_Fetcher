
name: Build MTG Deck Formatter

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Step 1: Check out repository
      - name: Check out repository code
        uses: actions/checkout@v4

      # Step 2: Set up Python on Windows and macOS
      - name: Set up Python (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Set up native Python and Tkinter on Linux
      - name: Set up Linux Python environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-venv \
            python3-dev \
            python3-tk \
            tk-dev

          # Check Python and glibc versions
          /usr/bin/python3 --version
          ldd --version | head -n 1

          # Verify Tkinter is installed
          /usr/bin/python3 -c "import tkinter; print('Tkinter OK:', tkinter.TkVersion)"

          # Create virtual environment using system Python
          /usr/bin/python3 -m venv .venv

          # Install dependencies
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install \
            pyinstaller \
            requests \
            certifi

          # Verify Tkinter inside virtual environment
          .venv/bin/python -c "import tkinter; print('Tkinter available in venv')"

      # Step 4: Install dependencies on Windows and macOS
      - name: Install dependencies (Windows/macOS)
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests certifi

      # Step 5.1: Build Windows GUI executable
      - name: Build Windows GUI
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller
          --clean
          --onefile
          --windowed
          --collect-all certifi
          --name MtgDeckFormatter
          main_gui.py

      # Step 5.2: Build Windows debug executable
      - name: Build Windows Debug Console
        if: runner.os == 'Windows'
        run: >
          python -m PyInstaller
          --clean
          --onefile
          --console
          --log-level DEBUG
          --collect-all certifi
          --name MtgDeckFormatter-debug
          main_gui.py

      # Step 5.3: Build macOS application
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: >
          python -m PyInstaller
          --clean
          --windowed
          --collect-all certifi
          --name MtgDeckFormatter
          main_gui.py

      # Step 5.4: Build Linux executable
      - name: Build Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          .venv/bin/python -m PyInstaller \
            --clean \
            --onefile \
            --collect-all certifi \
            --hidden-import=tkinter \
            --name MtgDeckFormatter \
            main_gui.py

      # Step 6: Check Linux build
      - name: Verify Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Checking executable..."
          file dist/MtgDeckFormatter

          echo "Checking bundled Tkinter..."
          .venv/bin/pyi-archive_viewer \
            -l dist/MtgDeckFormatter > archive_contents.txt

          if ! grep -qi tkinter archive_contents.txt; then
            echo "ERROR: Tkinter not found in executable!"
            exit 1
          fi

          echo "Tkinter found in executable."

      # Step 7: Upload executable artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MtgDeckFormatter-${{ runner.os }}
          if-no-files-found: error
          path: |
            dist/MtgDeckFormatter.exe
            dist/MtgDeckFormatter-debug.exe
            dist/MtgDeckFormatter.app/
            dist/MtgDeckFormatter
